id: 4a3b9d2f-7c5e-4f03-b2d6-8e9f0a1b2c03
name: 'Keyring: deletes, purges and recoveries'
description: |
  Lists secrets, certificates and keys deleted, purged or recovered through Keyring.
requiredDataConnectors:
  - connectorId: CustomLogsAma
    dataTypes:
      - KeyringAudit_CL
tactics:
  - Impact
relevantTechniques:
  - T1485
query: |
  // Deletes, purges and recoveries of secrets, certificates and keys through Keyring.
  let who = "";
  KeyringAudit_CL
  | where Action in ("secret.delete", "secret.purge", "secret.recover",
      "certificate.delete", "certificate.purge", "certificate.recover",
      "key.delete", "key.purge", "key.recover")
  | where isempty(who) or ActorUpn contains who or ActorObjectId =~ who
  | project TimeGenerated, Action, ActorUpn, ActorObjectId, Vault, ItemKind, ItemName, Outcome, ReasonCode, ClientIp, KvRequestId
  | order by TimeGenerated desc
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: AadUserId
        columnName: ActorObjectId
      - identifier: FullName
        columnName: ActorUpn
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: ClientIp
version: 1.0.0
