id: 4a3b9d2f-7c5e-4f03-b2d6-8e9f0a1b2c01
name: 'Keyring: secret values read'
description: |
  Lists secret values revealed through Keyring, with the actor, vault, item, client address, Key Vault request ID, reason and ticket. Set who at the top to filter by a person.
requiredDataConnectors:
  - connectorId: CustomLogsAma
    dataTypes:
      - KeyringAudit_CL
tactics:
  - CredentialAccess
relevantTechniques:
  - T1555
query: |
  // Secret values read through Keyring: who, which vault and item, from where.
  // The same question as "Secret values read" on Keyring's audit page, which
  // reads Key Vault's log. Set who to part of a sign-in name to narrow it.
  let who = "";
  KeyringAudit_CL
  | where Action == "secret.reveal"
  | where isempty(who) or ActorUpn contains who or ActorObjectId =~ who
  | project TimeGenerated, ActorUpn, ActorObjectId, Vault, ItemName, ItemVersion, Outcome, ReasonCode, ClientIp, KvRequestId, Reason, Ticket
  | order by TimeGenerated desc
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: AadUserId
        columnName: ActorObjectId
      - identifier: FullName
        columnName: ActorUpn
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: ClientIp
version: 1.0.0
