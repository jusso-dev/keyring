id: 3f2a8c1e-6b4d-4e92-a1c5-7d8e9f0a1b03
name: 'Keyring: one person denied in several vaults'
description: |
  Identifies when Azure Key Vault denies one person through Keyring at least 5 times across 3 or more distinct vaults within 60 minutes, indicating possible access probing.
severity: Medium
status: Available
requiredDataConnectors:
  - connectorId: CustomLogsAma
    dataTypes:
      - KeyringAudit_CL
queryFrequency: 1h
queryPeriod: 70m
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Discovery
relevantTechniques:
  - T1526
  - T1087
query: |
  let window = 60m;
  let delay = 10m;
  let probingVaults = 3;
  let probingDenied = 5;
  // One person denied by Key Vault in several vaults: probing for access.
  // Looks back window + delay for late rows; alerts only when a row counted
  // arrived in the last window.
  // Set by main.bicep: window, delay, probingVaults, probingDenied
  KeyringAudit_CL
  | where TimeGenerated > ago(window + delay)
  | where Outcome == "denied" and isnotempty(Vault)
  | summarize Denied = count(), VaultCount = dcount(Vault), Vaults = make_set(Vault, 20),
      Actions = make_set(Action, 10), ClientIp = take_any(ClientIp), ActorUpn = take_any(ActorUpn),
      TimeGenerated = max(TimeGenerated), LastArrived = max(coalesce(ingestion_time(), TimeGenerated))
      by ActorObjectId
  | where VaultCount >= probingVaults and Denied >= probingDenied and LastArrived > ago(window)
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: AadUserId
        columnName: ActorObjectId
      - identifier: FullName
        columnName: ActorUpn
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: ClientIp
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
