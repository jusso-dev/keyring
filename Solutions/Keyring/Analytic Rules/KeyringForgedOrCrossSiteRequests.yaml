id: 3f2a8c1e-6b4d-4e92-a1c5-7d8e9f0a1b05
name: 'Keyring: forged or cross-site requests'
description: |
  Identifies when Keyring refuses 5 or more requests from a single client IP address in 15 minutes as a forged form (csrf) or cross-site post (cross_site), indicating a possible attack on Keyring itself.
severity: Medium
status: Available
requiredDataConnectors:
  - connectorId: CustomLogsAma
    dataTypes:
      - KeyringAudit_CL
queryFrequency: 15m
queryPeriod: 25m
triggerOperator: gt
triggerThreshold: 0
tactics:
  - InitialAccess
relevantTechniques:
  - T1190
query: |
  let window = 15m;
  let delay = 10m;
  let attackThreshold = 5;
  // Requests Keyring refused as a forged form or a cross-site post: a possible
  // attack on Keyring itself.
  // Looks back window + delay for late rows; alerts only when a row counted
  // arrived in the last window.
  // Set by main.bicep: window, delay, attackThreshold
  KeyringAudit_CL
  | where TimeGenerated > ago(window + delay)
  | where Outcome == "refused" and ReasonCode in ("csrf", "cross_site")
  | summarize Refused = count(), Reasons = make_set(ReasonCode, 5), Actions = make_set(Action, 10),
      UserAgents = make_set(UserAgent, 5), take_any(ActorObjectId, ActorUpn),
      LastTime = max(TimeGenerated), TimeGenerated = max(TimeGenerated), LastArrived = max(coalesce(ingestion_time(), TimeGenerated))
      by ClientIp
  | where Refused >= attackThreshold and LastArrived > ago(window)
entityMappings:
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: ClientIp
  - entityType: Account
    fieldMappings:
      - identifier: AadUserId
        columnName: ActorObjectId
      - identifier: FullName
        columnName: ActorUpn
eventGroupingSettings:
  aggregationKind: AlertPerResult
version: 1.0.0
kind: Scheduled
