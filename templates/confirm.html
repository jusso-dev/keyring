{#- Shared typed-confirmation form. Include with a `confirm: ConfirmView` and `shell` in scope. -#}
<div class="panel narrow confirm">
  <h1>{{ confirm.heading }}</h1>
  <p>{{ confirm.warning }}</p>
  {% if let Some(second) = confirm.second_warning %}
  <p class="notice notice-error" role="alert">{{ second }}</p>
  {% endif %}
  <form method="post" action="{{ confirm.action }}">
    <input type="hidden" name="csrf" value="{{ shell.csrf() }}">
    <label for="confirm_name">Type <strong class="mono">{{ confirm.expected }}</strong> to confirm</label>
    <input id="confirm_name" name="confirm_name" type="text" required autocomplete="off" spellcheck="false" autocapitalize="off">
    <div class="actions">
      <button type="submit" class="button-danger">{{ confirm.button }}</button>
      <a href="{{ confirm.cancel_url }}">Cancel</a>
    </div>
  </form>
</div>
