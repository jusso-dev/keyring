{% extends "base.html" %}
{% block title %}{{ heading }} - Keyring{% endblock %}
{% block content %}
<div class="panel narrow">
  <h1>{{ heading }}</h1>
  <p>{{ message }}</p>
  {% if let Some(detail) = detail %}
  <p class="muted">{{ detail }}</p>
  {% endif %}
  <p><a class="button" href="{{ retry_url }}">Try again</a></p>
</div>
{% endblock %}
