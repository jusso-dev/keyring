{% extends "base.html" %}
{% block title %}{{ title }} - Keyring{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
<div class="empty-state">
  <p><strong>Choose a vault first.</strong></p>

  <p><a class="button" href="/vaults">Choose a vault</a></p>
</div>
{% endblock %}
