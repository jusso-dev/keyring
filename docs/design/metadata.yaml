  ## Status of this design

  This is a draft for review. Nobody has reviewed, approved or endorsed it, and nothing in it should be read as saying otherwise.

  Every feature described here is built and tested against mock Entra ID, Resource Graph, ARM, Key Vault, Log Analytics, Logs Ingestion, Communication Services and Event Grid servers that follow Microsoft's REST reference. What has been confirmed against a real Azure tenant is narrower:

  - **Confirmed:** the Key Vault REST calls, run against real vaults on 11-11-2026, 12-11-2026 and 13-11-2026 (by hand and with `tests/real_vault.rs`), and a browser run of Keyring against a real tenant on 17-11-2026.
  - **Built and tested against mocks only:** sign-in and on-behalf-of in a production deployment, PIM activation, Conditional Access step-up, the Bicep deployments, the Sentinel content, the audit sink, email through Azure Communication Services and the Event Grid webhook. Everything added in version 1.1 is in this group too: request access, activity emails, reveal limits, the access review, the webhook subscription allow-list and secret sharing (Microsoft Graph, PIM `AdminAssign` and plain role assignments at a secret's scope).

  `docs/real-vault-checklist.md` lists each check and its result. Section 11.5 lists what is still to confirm.
