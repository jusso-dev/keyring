version: 2

# The Rust version is written twice: rust-toolchain.toml (CI) and the
# builder image in the Dockerfile (the shipped binary). One group moves both
# in a single pull request. CI also checks the two match.
multi-ecosystem-groups:
  rust-toolchain-and-images:
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: deps

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  - package-ecosystem: docker
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: rust-toolchain-and-images

  - package-ecosystem: rust-toolchain
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: rust-toolchain-and-images

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
