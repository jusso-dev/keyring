name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so new advisories against main get noticed between changes.
    - cron: "17 3 * * 1"

permissions:
  contents: read

# A newer push to a pull request replaces the older run. Each push to main
# gets its own group (by commit), so no merged commit loses its run to a
# later one, and the weekly run has its own group too.
concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'schedule' || github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: fmt, clippy, test, build
    runs-on: ubuntu-24.04
    # No release build here: the container build job compiles the release
    # binary that ships (musl, LTO), so a second one for glibc only cost
    # runner time. The name stays, since branch protection requires it.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustup reads rust-toolchain.toml and installs the pinned version.
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # Docs that name a file under src/ must name one that exists.
      - name: Docs point at real source files
        run: |
          status=0
          tick='`'
          for path in $(grep -rhoE "${tick}src/[A-Za-z0-9_./-]+${tick}" README.md SECURITY.md docs | tr -d "$tick" | sort -u); do
            test -e "$path" || { echo "::error::docs name $path, which doesn't exist"; status=1; }
          done
          exit $status

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      # static/app.js against hand-written browser stubs. The runner's own
      # Node, no packages.
      - name: Browser script tests
        run: node --test tests/js/*.test.mjs

  supply-chain:
    name: cargo-deny, cargo-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # Prebuilt binaries from the action's manifest, checksums verified by
      # the action. Tool versions pinned. fallback: none makes a version
      # that isn't in the manifest fail the build, rather than download an
      # unpinned binary from somewhere else.
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2,cargo-cyclonedx@0.5.9
          fallback: none

      - name: cargo deny (licences, advisories, bans, sources)
        run: cargo deny --locked check

      - name: cargo audit
        run: cargo audit --deny warnings

      # The image SBOM (docker job) only sees the base image's packages,
      # because Rust crates are compiled into one stripped binary. This one
      # lists every crate from Cargo.lock that ships in the binary.
      - name: SBOM for the Rust crates
        run: |
          cargo cyclonedx --format json --target x86_64-unknown-linux-musl --no-build-deps --override-filename keyring-crates.cdx
          test "$(jq '.components | length' keyring-crates.cdx.json)" -gt 50

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: keyring-crates-sbom
          path: keyring-crates.cdx.json
          if-no-files-found: error

  bicep:
    name: bicep build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Validation only: builds every template and example parameter file.
      # No sign-in and no deployment. Bicep is pinned so a new release can't
      # change the result without a change here.
      - name: Build templates
        working-directory: infra
        env:
          BICEP_VERSION: v0.49.2
        run: |
          az bicep install --version "$BICEP_VERSION"
          az bicep version
          status=0
          for f in $(find . -name '*.bicep' -not -path './modules/*') $(find . -name '*.bicepparam'); do
            echo "::group::$f"
            case "$f" in
              *.bicepparam) az bicep build-params --file "$f" --stdout > /dev/null || status=1 ;;
              *) az bicep build --file "$f" --stdout > /dev/null || status=1 ;;
            esac
            echo "::endgroup::"
          done
          for f in modules/*.bicep; do
            az bicep build --file "$f" --stdout > /dev/null || status=1
          done
          # Copy each example the way the docs say (next to its template,
          # as main.bicepparam or access.bicepparam), so a broken `using`
          # path fails here. This covers infra/alerts, infra/sentinel,
          # infra/vm and infra/policy.
          for f in */*.example.bicepparam; do
            copy="${f%.example.bicepparam}.bicepparam"
            cp "$f" "$copy"
            az bicep build-params --file "$copy" --stdout > /dev/null || status=1
            rm "$copy"
          done
          # Each host template again with the audit sink on (the examples
          # above leave it off), so the audit-sink module is built as used.
          for t in app-service container-apps vm; do
            p="$t/audit-ci.bicepparam"
            { sed -e '/^param auditWorkspaceId/d' -e '/^param auditRequired/d' "$t/main.example.bicepparam"
              echo "param auditWorkspaceId = '/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-sentinel/providers/Microsoft.OperationalInsights/workspaces/law-sentinel'"
              echo "param auditRequired = true"
            } > "$p"
            az bicep build-params --file "$p" --stdout > /dev/null || status=1
            rm "$p"
          done
          # Each host template again with email on, on an Azure-managed
          # and a custom domain, so the notify module is built as used.
          for t in app-service container-apps vm; do
            for d in AzureManaged mail.example.com; do
              p="$t/notify-ci.bicepparam"
              { sed -e '/^param notify/d' "$t/main.example.bicepparam"
                echo "param notifyDomain = '$d'"
                echo "param notifyTypes = 'access-requests,health'"
                echo "param notifyAdmins = 'ops@example.com'"
                echo "param notifyAllowedDomains = 'example.com'"
              } > "$p"
              az bicep build-params --file "$p" --stdout > /dev/null || status=1
              rm "$p"
            done
          done
          # VM template again in ConfidentialVM mode with a Compute Gallery image.
          p="vm/cvm-ci.bicepparam"
          { sed -e '/^param securityType/d' -e '/^param galleryImageId/d' vm/main.example.bicepparam
            echo "param securityType = 'ConfidentialVM'"
            echo "param galleryImageId = '/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-images/providers/Microsoft.Compute/galleries/sig_keyring/images/keyring/versions/1.0.0'"
          } > "$p"
          az bicep build-params --file "$p" --stdout > /dev/null || status=1
          rm "$p"
          # Expiry alerts in both modes: the examples above build the action
          # group mode and Keyring's webhook mode; this builds the webhook
          # mode again with dead-lettering on and an existing topic.
          p="alerts/keyring-ci.bicepparam"
          { sed -e '/^param deadLetterContainerId/d' -e '/^param existingSystemTopicName/d' alerts/keyring.example.bicepparam
            echo "param deadLetterContainerId = '/subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg/providers/Microsoft.Storage/storageAccounts/st/blobServices/default/containers/deadletter'"
            echo "param existingSystemTopicName = 'kv-app-prod-events'"
          } > "$p"
          az bicep build-params --file "$p" --stdout > /dev/null || status=1
          rm "$p"
          # Sentinel with every rule on and Keyring's address given, so the
          # two rules left out without one are built too, on both tables.
          for table in AzureDiagnostics AZKVAuditLogs; do
            p="sentinel/all-ci.bicepparam"
            { sed -e '/^param enable/d' -e '/^param keyVaultTable/d' sentinel/main.example.bicepparam
              for e in $(sed -n 's/^param \(enable[A-Za-z]*\) bool.*/\1/p' sentinel/main.bicep); do
                echo "param $e = true"
              done
              echo "param keyVaultTable = '$table'"
            } > "$p"
            az bicep build-params --file "$p" --stdout > /dev/null || status=1
            rm "$p"
          done
          exit $status

  terraform:
    name: terraform validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.11.4"
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive -diff infra/terraform

      # Seven directories each need the azurerm provider (about 100 MB).
      # One shared cache, kept between runs, downloads it once.
      - name: Provider cache directory
        run: |
          mkdir -p "$RUNNER_TEMP/terraform-plugins"
          echo "TF_PLUGIN_CACHE_DIR=$RUNNER_TEMP/terraform-plugins" >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/terraform-plugins
          key: terraform-plugins-${{ runner.os }}-${{ hashFiles('infra/terraform/**/versions.tf') }}
          restore-keys: terraform-plugins-${{ runner.os }}-

      - name: Validate modules and stacks
        run: |
          status=0
          for dir in infra/terraform/modules/* infra/terraform/stacks/*; do
            echo "::group::$dir"
            (cd "$dir" && terraform init -backend=false -input=false && terraform validate) || status=1
            echo "::endgroup::"
          done
          exit $status

  sentinel:
    name: sentinel packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Sentinel ARM templates, Content Hub V3 package and YAML/KQL
        env:
          BICEP_VERSION: v0.49.2
        run: |
          az bicep install --version "$BICEP_VERSION"
          python3 tools/sentinel/package.py --check
          python3 tools/sentinel/validate.py

  docker:
    name: container build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Dependabot moves rust-toolchain.toml and the builder image in one
      # pull request; this catches the two drifting apart anyway.
      - name: Builder image matches rust-toolchain.toml
        run: |
          want=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          grep -q "FROM rust:${want}-" Dockerfile || { echo "Dockerfile builder isn't Rust ${want}" >&2; exit 1; }

      - name: Image version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: keyring:ci
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the image
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Non-root, numeric user.
          test "$(docker inspect keyring:ci --format '{{.Config.User}}')" = "65532:65532"
          # Tied to the commit it was built from.
          test "$(docker inspect keyring:ci --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          test "$(docker inspect keyring:ci --format '{{index .Config.Labels "org.opencontainers.image.version"}}')" = "$VERSION"
          # No shell in the runtime image.
          if docker run --rm --entrypoint /bin/sh keyring:ci -c true 2>/dev/null; then
            echo "runtime image has a shell" >&2; exit 1
          fi
          # Size, for the README (target under 30 MB).
          size=$(docker image inspect keyring:ci --format '{{.Size}}')
          echo "Image size: $((size / 1024 / 1024)) MB"
          test "$size" -lt $((30 * 1024 * 1024))

      - name: Smoke test the image
        run: |
          docker run -d --name keyring --read-only --cap-drop ALL --security-opt no-new-privileges -p 3000:3000 \
            -e ENTRA_TENANT_ID=00000000-0000-0000-0000-000000000000 \
            -e ENTRA_CLIENT_ID=00000000-0000-0000-0000-000000000000 \
            -e ENTRA_CLIENT_SECRET=ci-placeholder \
            -e APP_BASE_URL=http://localhost:3000 \
            -e SESSION_SECRET=ci-placeholder-ci-placeholder-ci-placeholder \
            keyring:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3000/healthz; then
              # Health needs no sign-in and says nothing else.
              test "$(curl -fsS http://localhost:3000/healthz)" = "ok"
              # Other pages do need sign-in.
              test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/)" = "303"
              exit 0
            fi
            sleep 1
          done
          docker logs keyring
          exit 1

      # Base image packages (CA certificates, tzdata). Crates are in the
      # keyring-crates-sbom artifact from the supply-chain job.
      - name: SBOM for the image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: keyring:ci
          format: cyclonedx-json
          output-file: keyring-sbom.cdx.json
          upload-artifact: false

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: keyring-sbom
          path: keyring-sbom.cdx.json
          if-no-files-found: error
