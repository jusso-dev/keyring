name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly, so new advisories against main get noticed between changes.
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: fmt, clippy, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustup reads rust-toolchain.toml and installs the pinned version.
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Release build
        run: cargo build --release --locked

  supply-chain:
    name: cargo-deny, cargo-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      # Prebuilt binaries, checksums verified by the action. Tool versions pinned.
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2

      - name: cargo deny (licences, advisories, bans, sources)
        run: cargo deny --locked check

      - name: cargo audit
        run: cargo audit --deny warnings

  docker:
    name: container build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: keyring:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the image
        run: |
          # Non-root, numeric user.
          test "$(docker inspect keyring:ci --format '{{.Config.User}}')" = "65532:65532"
          # No shell in the runtime image.
          if docker run --rm --entrypoint /bin/sh keyring:ci -c true 2>/dev/null; then
            echo "runtime image has a shell" >&2; exit 1
          fi
          # Size, for the README (target under 30 MB).
          size=$(docker image inspect keyring:ci --format '{{.Size}}')
          echo "Image size: $((size / 1024 / 1024)) MB"
          test "$size" -lt $((30 * 1024 * 1024))

      - name: Smoke test the image
        run: |
          docker run -d --name keyring --read-only --cap-drop ALL --security-opt no-new-privileges -p 3000:3000 \
            -e ENTRA_TENANT_ID=00000000-0000-0000-0000-000000000000 \
            -e ENTRA_CLIENT_ID=00000000-0000-0000-0000-000000000000 \
            -e ENTRA_CLIENT_SECRET=ci-placeholder \
            -e APP_BASE_URL=http://localhost:3000 \
            -e SESSION_SECRET=ci-placeholder-ci-placeholder-ci-placeholder \
            keyring:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3000/healthz; then
              # Health needs no sign-in and says nothing else.
              test "$(curl -fsS http://localhost:3000/healthz)" = "ok"
              # Other pages do need sign-in.
              test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/)" = "303"
              exit 0
            fi
            sleep 1
          done
          docker logs keyring
          exit 1

      - name: SBOM for the image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: keyring:ci
          format: cyclonedx-json
          output-file: keyring-sbom.cdx.json
          upload-artifact: false

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: keyring-sbom
          path: keyring-sbom.cdx.json
          if-no-files-found: error
