[package]
name = "keyring"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "A plain-English web front end for Azure Key Vault that acts as the signed-in user"
repository = "https://github.com/jusso-dev/keyring"
publish = false

[dependencies]
askama = { version = "0.16", default-features = false, features = ["derive", "std"] }
axum = { version = "0.8", default-features = false, features = ["form", "http1", "query", "tokio", "tracing"] }
base64 = "0.22"
openidconnect = { version = "4.1", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "form"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "ansi"] }
x509-cert = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
tower = { version = "0.5", default-features = false, features = ["util"] }
http-body-util = "0.1"
rsa = { version = "0.9", default-features = false, features = ["std", "pem", "u64_digit", "getrandom"] }
chrono = { version = "0.4", default-features = false }
url = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }

# Test-only RSA key generation is very slow unoptimised.
[profile.dev.package.rsa]
opt-level = 3
