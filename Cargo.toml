[package]
name = "keyring"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "A plain-English web front end for Azure Key Vault that acts as the signed-in user"
repository = "https://github.com/yumaitau/keyring"
publish = false

[dependencies]
askama = { version = "0.16", default-features = false, features = ["derive", "std"] }
axum = { version = "0.8", default-features = false, features = ["form", "http1", "query", "tokio", "tracing"] }
tokio = { version = "1", default-features = false, features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "ansi"] }

[dev-dependencies]
tower = { version = "0.5", default-features = false, features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
